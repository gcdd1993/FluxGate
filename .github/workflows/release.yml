# 发版流程：打 tag 触发（tag 需与 src-tauri/tauri.conf.json 的 version 一致，如 v0.1.0）
#   git tag v0.1.0 && git push origin v0.1.0
# 前置条件：仓库 Secrets 里配置 TAURI_SIGNING_PRIVATE_KEY（~/.tauri/fluxgate.key 的内容）。
# tauri-action 会构建 NSIS 安装包、用私钥签名更新包，并生成 latest.json 一并上传到
# GitHub Release —— 应用内的自动更新即从该 latest.json 检查新版本。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 快速自检：secret 缺失时 30 秒内失败并给出明确提示，避免白跑 8 分钟编译。
      # 只输出长度，绝不打印密钥内容。本地私钥文件约 300+ 字符；
      # 如果这里显示几十个字符，说明存成路径或公钥了。
      - name: Verify signing key secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 为空或未配置（Settings → Secrets and variables → Actions → Repository secrets）"
            exit 1
          fi
          echo "signing key present, length: ${#TAURI_SIGNING_PRIVATE_KEY}"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FluxGate ${{ github.ref_name }}"
          releaseBody: "下载下方安装包安装；已安装的用户会通过应用内自动更新收到本版本。"
          releaseDraft: false
          prerelease: false
